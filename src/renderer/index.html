<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 视觉对话助手</title>
</head>
<body>
  <!-- Preload diagnostic (runs BEFORE React, visible even if app crashes) -->
  <div id="preload-diag" style="position:fixed;top:0;left:0;right:0;z-index:9999;padding:6px 12px;font-size:13px;font-family:monospace;text-align:center;color:white;"></div>
  <script>
    (function() {
      var el = document.getElementById('preload-diag');
      function show(msg, bg) { el.textContent = msg; el.style.background = bg; el.style.opacity = '1'; }
      function hide() { el.style.transition = 'opacity 0.5s'; el.style.opacity = '0'; setTimeout(function(){ el.style.display = 'none'; }, 500); }
      show('⏳ 正在加载...', '#333');
      var start = Date.now();
      var shown = false;
      var check = setInterval(function() {
        if (window.electronAPI) {
          clearInterval(check);
          if (!shown) { show('✅ 已连接 (' + (Date.now()-start) + 'ms)', '#1a8a3f'); shown = true; }
          window.electronAPI.getPreferences().then(function(p) {
            show('✅ 就绪 | ' + (p.deepseekApiKey ? 'DeepSeek' : '千问VL'), '#1a8a3f');
            setTimeout(hide, 1500);
          }).catch(function() { setTimeout(hide, 1000); });
        }
        if (Date.now() - start > 5000) {
          clearInterval(check);
          show('❌ electronAPI 未加载', '#c22');
        }
      }, 200);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
